{% extends "base.html" %}
{% block title %}{{ heading }} · ShopManage{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">INVENTORY</p><h1>{{ heading }}</h1><p class="muted">Enter the product details below.</p></div><a class="text-link" href="{{ url_for('products') }}">← Back to products</a></section>
<form class="panel form-panel" method="post">
  <label>Product name *<input name="product_name" required maxlength="120" value="{{ product.product_name if product else '' }}"></label>
  <div class="form-grid"><label>Category<input name="category" value="{{ product.category if product and product.category else '' }}"></label><label>Price (₹) *<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '0.00' }}"></label><label>Quantity in stock *<input type="number" name="quantity" min="0" step="1" required value="{{ product.quantity if product else 0 }}"></label></div>
  <label>Description<textarea name="description" rows="3">{{ product.description if product and product.description else '' }}</textarea></label>
  <div class="form-actions"><button class="btn">Save product</button><a class="btn secondary" href="{{ url_for('products') }}">Cancel</a></div>
</form>
{% endblock %}
